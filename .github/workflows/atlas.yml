name: Fork Atlas — discover & publish

# Nightly: discover new forks (stub records, no LLM), refresh cheap metadata,
# rebuild matrix + MATRIX.md + CSV, commit, deploy the viewer to GitHub Pages.
# Holds NO third-party secrets. Classification (LLM, write-once) runs locally.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "overrides/**"
      - "taxonomy.yaml"
      - "scripts/**"
      - "site/**"
      - "projects/**"
      - ".github/workflows/atlas.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Discover forks (metadata only)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py --user ${{ github.repository_owner }}
      - name: Build matrix
        run: python scripts/build.py
      - name: Commit changes (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: |
          git config user.name "fork-atlas[bot]"
          git config user.email "fork-atlas@users.noreply.github.com"
          git add -A catalog matrix.json matrix.csv MATRIX.md site/matrix.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "atlas: nightly discover + build ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
